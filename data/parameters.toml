# Model parameters. Every uncertain scalar has a central `value`, optional
# `low`/`high` bounds and a `dist` for Monte Carlo sampling (see
# src/beefwhatif/params.py): fixed | uniform | tri (mode = value) |
# lognormal (median = value, [low, high] = 90% interval).
# `source` keys refer to entries in paper/references.bib.

[meta]
seed = 20261029
n_mc = 20000
n_campus = 4000
base_year = 2024

# ----------------------------------------------------------------- populations
[population]
london = { value = 9089736, unit = "persons", source = "ons2025pop", note = "ONS mid-2024 estimate, Greater London" }
uk = { value = 69281437, unit = "persons", source = "ons2025pop", note = "ONS mid-2024 estimate, United Kingdom" }

# ---------------------------------------------------------- London and UK GHG
[london]
leggi_total_mt = { value = 28.61, low = 27.9, high = 30.0, dist = "tri", unit = "MtCO2e/yr", source = "leggi2025", note = "LEGGI 2023 (interim, Dec 2025), territorial; 2021-2022 were 29.8-30.0" }
consumption_based_mt = { value = 87.95, low = 80.7, high = 88.0, dist = "tri", unit = "MtCO2e/yr", source = "gla2024cbe", note = "London consumption-based emissions 2022 (University of Leeds for GLA); 80.7 in 2021" }
consumption_food_mt = { value = 9.80, unit = "MtCO2e/yr", source = "gla2024cbe", note = "Food within London's consumption-based emissions, 2022" }

[uk]
territorial_mt = { value = 373.4, unit = "MtCO2e/yr", source = "desnz2026ghg", note = "UK territorial GHG emissions 2024 (final)" }
consumption_mt = { value = 699.2, unit = "MtCO2e/yr", source = "defra2026footprint", note = "UK consumption footprint 2023" }
agriculture_mt = { value = 46.52, unit = "MtCO2e/yr", source = "desnz2026ghg", note = "UK agriculture 2024" }
beef_enteric_mt = { value = 11.33, unit = "MtCO2e/yr", source = "desnz2026ghg", note = "Enteric fermentation, beef cattle, 2024 (AR5)" }
beef_manure_mt = { value = 2.68, unit = "MtCO2e/yr", source = "desnz2026ghg", note = "Manure management, beef cattle, 2024 (AR5)" }

# ------------------------------------------------------------- beef consumption
[consumption]
beef_cwe_kg_per_cap = { value = 15.8, low = 11.2, high = 16.9, dist = "tri", unit = "kg cwe/person/yr", source = "defra2025auk", note = "UK supply 2024: (929 + 307 - 142) kt / 69.3 M. High: FAO food balance 16.85 (2023). Low: consistent with NDNS beef intake 13.3 g/day as eaten" }
dairy_origin_share = { value = 0.50, low = 0.37, high = 0.55, dist = "tri", unit = "fraction", source = "ciel2020", note = "About half of UK beef comes from the dairy herd" }

[conversion]
beef_retail_yield = { value = 0.70, low = 0.62, high = 0.74, dist = "tri", unit = "kg retail / kg cwe", source = "poore2018", note = "Fat- and bone-free meat incl. edible offal = 72% of carcass (Poore & Nemecek Table S5); AAFC 0.73; closely trimmed boneless 0.62" }
beef_cook_yield = { value = 0.69, low = 0.67, high = 0.73, dist = "tri", unit = "kg cooked / kg raw", source = "showell2012", note = "Beef mince <12% fat, crumbles, pan-fried 0.69 (0.67-0.70); broiled patty 0.73" }
household_waste_frac = { value = 0.10, low = 0.06, high = 0.14, dist = "tri", unit = "fraction of purchases", source = "defra2010waste", note = "10% of red-meat purchases wasted (poultry 14%, cheese 13%, milk 8%); applied to all foods" }

